<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title th:text="${funding.title}">펀딩 상세</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 20px; background: #f7f7f7; }
        .container { display: flex; flex-direction: column; max-width: 1000px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .top-section { display: flex; gap: 24px; }
        .top-left img { width: 400px; border-radius: 8px; background: #ddd; }
        .top-right { flex: 1; }
        .top-right h2 { margin-bottom: 12px; font-size: 24px; }
        .info-row { margin-bottom: 8px; color: #555; }
        .progress-bar-container { background: #eee; height: 12px; border-radius: 6px; margin: 8px 0; }
        .progress-bar { background: #3b82f6; height: 12px; border-radius: 6px; width: 60%; }
        .button { padding: 10px 18px; background: #3b82f6; color: white; border: none; border-radius: 4px; margin-top: 12px; cursor: pointer; }
        .bottom-section { margin-top: 40px; }
        .bottom-section h3 { border-bottom: 1px solid #ccc; padding-bottom: 8px; }
        .related-projects { margin-top: 40px; }
        .related-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .related-item .thumb { width: 48px; heigvht: 48px; background: #ddd; border-radius: 4px; }
        .related-item .text { font-size: 14px; }
        .like-row{display:flex;align-items:center;gap:12px;margin:12px 0;}
        .btn-like{
            display:inline-flex;align-items:center;gap:8px;
            background:#fff;color:#dc3545;border:1px solid #dc3545;
            padding:8px 12px;border-radius:6px;font-weight:600;cursor:pointer;
        }
        .btn-like.filled{background:#dc3545;color:#fff;border-color:#dc3545;}
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: commonHeader}"></div>
<div class="container">
    <div class="top-section">
        <div class="top-left">
            <img th:src="@{${funding.imagePath}}" alt="펀딩 이미지">
        </div>
        <div class="top-right">
            <h2 th:text="${funding.title}">펀딩 제목</h2>
            <div class="info-row">프로젝트 기간: <span>2023.10.01 ~ 2023.11.30</span> (60일)</div>
            <div class="progress-bar-container">
                <div class="progress-bar" style="width:60%"></div>
            </div>
            <div class="info-row">60% 달성 (30일 남음)</div>
            <div class="info-row">
                현재 모금액: <strong th:text="${#numbers.formatDecimal(funding.currentPrice, 0, 'COMMA', 0, 'POINT') + '원'}"></strong><br>
                목표 금액: <span th:text="${#numbers.formatDecimal(funding.maxPrice, 0, 'COMMA', 0, 'POINT') + '원'}"></span><br>
                참여자: <span>328명</span>
            </div>

            <div class="like-row">
                <button id="likeBtn" type="button" class="btn-like">
                    <span id="heartIcon">♡</span>
                    <span>좋아요</span>
                </button>
                <div><strong>총 좋아요:</strong> <span id="likeCount" th:text="${funding.likeCount}">0</span></div>
            </div>

            <button class="button" th:onclick="|location.href='@{/funding/participate/{id}(id=${funding.fundingId})}'|">프로젝트 참여하기</button>
            <div style="margin-top: 8px;">
                <button class="button" style="background:#f3f3f3; color:#333;">공유하기</button>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <h3>프로젝트 소개</h3>
        <p th:text="${funding.description}">펀딩 설명이 들어갑니다.</p>
    </div>

    <div class="related-projects">
        <h3>관련 프로젝트</h3>
        <div class="related-item">
            <div class="thumb"></div>
            <div class="text">
                도시 텃밭 가꾸기 프로젝트<br><small>?% 달성 | ?일 남음</small>
            </div>
        </div>
        <div class="related-item">
            <div class="thumb"></div>
            <div class="text">
                친환경 에너지 시설 구축<br><small>?% 달성 | ?일 남음</small>
            </div>
        </div>
    </div>
</div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function(){
            const fundingId = /*[[${funding.fundingId}]]*/ 0;
            const likeBtn = document.getElementById('likeBtn');
            const heartIcon = document.getElementById('heartIcon');
            const likeCountEl = document.getElementById('likeCount');

            function setHeart(liked){
                if(liked){
                    heartIcon.textContent = '❤';
                    likeBtn.classList.add('filled');
                }else{
                    heartIcon.textContent = '♡';
                    likeBtn.classList.remove('filled');
                }
            }

            // 초기 상태 로드 (로그인 X면 liked=false로 내려옴)
            fetch(`/funding/${fundingId}/like/state`)
                .then(r => r.ok ? r.json() : { liked:false, likeCount: Number(likeCountEl.textContent||'0') })
                .then(s => {
                    setHeart(!!s.liked);
                    if(typeof s.likeCount === 'number') likeCountEl.textContent = s.likeCount;
                })
                .catch(() => { /* SSR 값 유지 */ });

            // 토글
            likeBtn.addEventListener('click', async () => {
                try{
                    const res = await fetch(`/funding/${fundingId}/like/toggle`, { method:'POST' });
                    if(res.status === 401){
                        alert('로그인이 필요합니다.');
                        return;
                    }
                    const data = await res.json();
                    if(data.result === 'success'){
                        setHeart(!!data.liked);
                        if(typeof data.likeCount === 'number') likeCountEl.textContent = data.likeCount;
                    }else{
                        alert(data.error || '처리 중 오류가 발생했습니다.');
                    }
                }catch(e){
                    console.error(e);
                    alert('네트워크 오류가 발생했습니다.');
                }
            });
        });
    </script>
</body>
</html>
