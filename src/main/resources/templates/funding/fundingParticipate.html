<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>펀딩 참여</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .funding-info p { margin: 8px 0; }
        form div { margin: 12px 0; }
        button { padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: commonHeader}"></div>

<div class="container">
    <h1 th:text="'펀딩 참여 - ' + ${funding.title}">펀딩 참여</h1>

    <div class="funding-info">
        <p>펀딩 제목:
            <strong th:text="${funding.title}">제목</strong>
        </p>
        <p>목표 금액:
            <span th:text="${funding.maxPrice} + '원'">0원</span>
        </p>
        <p>현재 금액:
            <span th:text="${funding.currentPrice} + '원'">0원</span>
        </p>
    </div>

    <form id="participateForm">
        <input type="hidden" name="fundingId" th:value="${funding.fundingId}" />

        <div>
            <label for="givePrice">참여 금액</label><br>
            <input type="number" id="givePrice" name="givePrice" min="1" required />
        </div>

        <button type="submit">참여하기</button>
    </form>
</div>

<script>
    $(function() {
        $('#participateForm').submit(function(e) {
            e.preventDefault();
            const data = $(this).serialize();

            $.ajax({
                url: '/funding/participate',
                type: 'POST',
                data: data,
                success: function(res) {
                    window.location.href = '/funding/participate-complete';
                },
                error: function(xhr) {
                    alert(xhr.responseJSON?.error || '참여 처리 중 오류가 발생했습니다.');
                }
            });
        });
    });
</script>
</body>
</html>
