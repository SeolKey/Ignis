<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>펀딩 작성</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- 공통 헤더 -->
	<div th:replace="~{fragments/header :: commonHeader}"></div>

    <h1>펀딩 등록</h1>
		<form id="fundingForm" enctype="multipart/form-data" method="post">
		    <input type="text" name="title" id="title" placeholder="제목" required><br>
		    <textarea name="description" id="description" placeholder="설명" required></textarea><br>
		    <input type="text" name="accountInfo" id="accountInfo" placeholder="계좌 정보" required><br>
		    <input type="number" name="maxPrice" id="maxPrice" placeholder="목표 금액" required><br>
		    <input type="file" name="file" id="file" accept="image/*"><br>
		    <button type="submit">작성하기</button>
		</form>

    <script>
	    $("#fundingForm").submit(function(e) {
	        e.preventDefault();
	
	        const formData = new FormData();
	        formData.append("title", $("#title").val());
	        formData.append("description", $("#description").val());
	        formData.append("accountInfo", $("#accountInfo").val()); // 현재 DB에는 없지만 프론트상 존재
	        formData.append("maxPrice", $("#maxPrice").val());
	        formData.append("file", $("#file")[0].files[0]);
	
	        $.ajax({
	            url: "/funding/create",
	            method: "POST",
	            data: formData,
	            processData: false,
	            contentType: false,
	            success: function(response) {
	                alert("펀딩 등록 성공!");
	                location.href = "/funding/funding-list-view";
	            },
	            error: function(xhr) {
	                alert("등록 실패: " + (xhr.responseJSON?.error_message || "알 수 없는 오류"));
	            }
	        });
	    });
	</script>

</body>
</html>
