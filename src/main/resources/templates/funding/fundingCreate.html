<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>펀딩 등록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        form input[type="text"],
        form input[type="number"],
        form input[type="file"],
        form textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        form textarea {
            height: 100px;
        }

        .preview {
            margin-top: 10px;
        }

        .preview img {
            max-width: 100%;
            border-radius: 5px;
            margin-top: 5px;
        }

        .btn-submit {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<div class="container">
    <h1>펀딩 등록</h1>

    <form id="fundingForm" enctype="multipart/form-data">
        <label for="title">제목</label>
        <input type="text" id="title" name="title" required>

        <label for="description">설명</label>
        <textarea id="description" name="description" required></textarea>

        <label for="accountInfo">계좌 정보</label>
        <input type="text" id="accountInfo" name="accountInfo">

        <label for="maxPrice">목표 금액</label>
        <input type="number" id="maxPrice" name="maxPrice" required>

        <label for="mainImage">대표 이미지</label>
        <input type="file" id="mainImage" name="mainImage" accept="image/*">
        <div id="mainPreview" class="preview"></div>

        <label for="subImage">서브 이미지 (선택)</label>
        <input type="file" id="subImage" name="subImage" accept="image/*">
        <div id="subPreview" class="preview"></div>

        <button type="submit" class="btn-submit">작성하기</button>
    </form>
</div>

<script>
    // ✅ 미리보기 기능
    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        preview.innerHTML = "";
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement("img");
                img.src = e.target.result;
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    }

    document.getElementById("mainImage").addEventListener("change", (e) => {
        previewImage(e.target, "mainPreview");
    });

    document.getElementById("subImage").addEventListener("change", (e) => {
        previewImage(e.target, "subPreview");
    });

    // ✅ 폼 전송
    const form = document.getElementById("fundingForm");
    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(form);

        fetch("/funding/create", {
            method: "POST",
            body: formData
        })
            .then(res => res.json())
            .then(data => {
                if (data.code === 1 || data.result === "success") {
                    alert("펀딩 등록 성공!");
                    window.location.href = "/funding/funding-list-view";
                } else {
                    alert("등록 실패: " + (data.errorMessage || "서버 오류"));
                }
            })
            .catch(err => {
                alert("서버 오류 발생: " + err);
            });
    });
</script>

</body>
</html>
