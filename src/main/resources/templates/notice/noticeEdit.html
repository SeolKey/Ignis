<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 수정</title>
</head>
<body>
    <h1>공지사항 수정</h1>
    <form th:action="@{'/notice/notice-edit-view/' + ${notice.id}}" method="post" th:object="${notice}">
        <label for="title">제목:</label><br>
        <input type="text" id="title" th:field="*{title}"><br><br>

        <label for="content">내용:</label><br>
        <textarea id="content" th:field="*{content}" rows="10" cols="50"></textarea><br><br>

        <input type="submit" value="수정">
    </form>
    <a th:href="@{/notice/list}">목록으로</a>
</body>
</html>
