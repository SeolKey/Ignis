<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>공지사항 작성</title>
    <script>
        function submitNoticeForm(event) {
            event.preventDefault(); // 기본 form 전송 막기

            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;

            fetch("/notice/create", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    title: title,
                    content: content
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === "성공") {
                    alert("공지사항이 등록되었습니다.");
                    window.location.href = "/notice/notice-list-view";
                } else {
                    alert("오류: " + data.error);
                }
            })
            .catch(error => {
                console.error("에러 발생:", error);
                alert("서버 오류가 발생했습니다.");
            });
        }
    </script>
</head>
<body>
<div th:replace="~{fragments/header :: commonHeader}"></div>s
    <h1>공지사항 작성</h1>
    <form onsubmit="submitNoticeForm(event)">
        <label for="title">제목:</label><br>
        <input type="text" id="title" name="title"><br><br>

        <label for="content">내용:</label><br>
        <textarea id="content" name="content" rows="10" cols="50"></textarea><br><br>

        <input type="submit" value="작성">
    </form>
    <a th:href="@{/notice/list}">목록으로</a>
</body>
</html>
