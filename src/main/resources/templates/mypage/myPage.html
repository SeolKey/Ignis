<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <script>
        function changePassword() {
            const currentPassword = document.getElementById("currentPassword").value;
            const newPassword = document.getElementById("newPassword").value;

            fetch("/mypage/change-password", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ currentPassword, newPassword })
            })
                .then(res => res.json())
                .then(data => {
                    alert(data.result || data.error_message);
                });
        }

        function changeEmail() {
            const newEmail = document.getElementById("newEmail").value;

            fetch("/mypage/change-email", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ newEmail })
            })
                .then(res => res.json())
                .then(data => {
                    alert(data.result || data.error_message);
                });
        }
    </script>
</head>
<body>
<h1 th:text="'[ ' + ${userName} + ' ] 님의 마이페이지'">마이페이지</h1>

<hr>

<h3>비밀번호 변경</h3>
<label for="currentPassword">현재 비밀번호:</label>
<input type="password" id="currentPassword" placeholder="현재 비밀번호">
<br>
<label for="newPassword">새 비밀번호:</label>
<input type="password" id="newPassword" placeholder="새 비밀번호">
<br>
<button onclick="changePassword()">비밀번호 변경</button>

<hr>

<h3>이메일 변경</h3>
<label for="newEmail">새 이메일:</label>
<input type="email" id="newEmail" placeholder="example@email.com">
<br>
<button onclick="changeEmail()">이메일 변경</button>
</body>
</html>
