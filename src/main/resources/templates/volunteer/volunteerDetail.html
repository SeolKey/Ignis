<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>봉사 상세</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            background: #fff;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .left-box {
            flex: 2;
        }

        .right-box {
            flex: 1;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            background-color: #fafafa;
        }

        .main-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .info-row {
            margin-bottom: 15px;
        }

        .info-label {
            font-weight: bold;
            margin-right: 10px;
        }

        .progress {
            height: 8px;
            background-color: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar {
            height: 100%;
            background-color: #4cafef;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-weight: bold;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }

        .section-title {
            margin: 30px 0 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .box-gray {
            background-color: #f2f2f2;
            height: 200px;
            border-radius: 10px;
        }

        .join-button {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background-color: #3683f0;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: commonHeader}"></div>

<div class="container">
    <!-- Left -->
    <div class="left-box">
        <img class="main-image" th:src="@{${volunteer.imagePath}}" alt="봉사 이미지">

        <div class="tabs">
            <div>상세내용</div>
            <div>안내사항</div>
            <div>댓글</div>
        </div>

        <div class="section-title">프로젝트 소개</div>
        <div class="box-gray">
            <p th:text="${volunteer.description}">설명</p>
        </div>

        <div class="section-title">내용</div>
        <div class="box-gray"></div>
    </div>

    <!-- Right -->
    <div class="right-box">
	    <h2 th:text="${volunteer.title}">제목</h2>
	
	    <div class="info-row">
	        <span class="info-label">봉사 기간</span>
	        <span th:text="${#temporals.format(volunteer.startTime, 'yyyy.MM.dd')} + ' ~ ' + ${#temporals.format(volunteer.endTime, 'yyyy.MM.dd')}"></span>
	    </div>
	
	    <div class="progress">
	        <div class="progress-bar"
	             th:style="'width: ' + ${volunteer.currentPeople * 100 / volunteer.maxParticipants} + '%'">
	        </div>
	    </div>
	
	    <div class="info-row">
	        <span th:text="${volunteer.currentPeople} + '명 참여중'"></span>
	    </div>
	
	    <div class="info-row">
	        <strong>최대 인원:</strong>
	        <span th:text="${volunteer.maxParticipants} + '명'"></span>
	    </div>
	
	    <!-- ✅ 이름 수정 -->
	    <button class="join-button">봉사 참여하기</button>
	
	    <!-- ✅ 공유하기 추가 -->
	    <div style="margin-top: 15px; text-align: center; font-size: 14px; color: #333;">
	        <span style="cursor: pointer;">🔗 공유하기</span>
	    </div>
	</div>
</div>

</body>
</html>
