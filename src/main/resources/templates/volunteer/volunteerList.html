<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>봉사 목록</title>
    <style>
        .volunteer-box {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 6px;
        }
        .volunteer-title-link {
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: black;
        }
        .volunteer-title-link:hover {
            color: #2a7ae2;
            text-decoration: underline;
        }
        .tabs { display:flex; gap:8px; margin:12px 0 20px; }
        .tab-btn {
            padding:8px 14px; border:1px solid #ccc; border-radius:6px;
            text-decoration:none; color:#333; background:#fff; font-weight:600;
        }
    </style>
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<h1>봉사 목록</h1>

<button onclick="location.href='/volunteer/volunteer-create-view'">봉사 글 작성</button>

<div class="tabs">
    <a th:href="@{/volunteer/volunteer-list-view(sort='latest')}"
       class="tab-btn"
       th:classappend="${sort}=='latest' ? ' active' : ''">최신순</a>
    <a th:href="@{/volunteer/volunteer-list-view(sort='views')}"
       class="tab-btn"
       th:classappend="${sort}=='views' ? ' active' : ''">조회순</a>
</div>

<div th:if="${volunteerList != null}">
    <div th:each="v : ${volunteerList}" class="volunteer-box">
        <a th:href="@{/volunteer/volunteer-detail-view(volunteerId=${v.volunteerId})}" 
           class="volunteer-title-link" 
           th:text="${v.title}">제목</a>
        <p th:text="'장소: ' + ${v.location}">장소</p>
        <p th:text="'기간: ' + ${#temporals.format(v.startTime, 'yyyy-MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(v.endTime, 'yyyy-MM-dd HH:mm')}">기간</p>
        <p th:text="'정원: ' + ${v.currentPeople} + ' / ' + ${v.maxParticipants}">정원</p>
    </div>
</div>

</body>
</html>
