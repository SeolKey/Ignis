<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>봉사글 목록 (관리자용)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>

<body>
<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">봉사글 목록 (관리자용)</h2>
        <a href="/admin/main" class="btn btn-outline-secondary">← 관리자 메인으로</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>위치</th>
                <th>시작 시간</th>
                <th>종료 시간</th>
                <th>상태</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>

            <!-- ✅ PENDING 상태인 봉사글만 표시 -->
            <tr th:each="volunteer : ${volunteerList}"
                th:if="${volunteer.status == 'PENDING'}">
                <td th:text="${volunteer.volunteerId}">1</td>
                <td>
                    <a th:href="@{'/admin/volunteer-detail-view/' + ${volunteer.volunteerId}}"
                       th:text="${volunteer.title}"
                       class="text-decoration-none fw-semibold text-primary"></a>
                </td>
                <td th:text="${volunteer.location}">서울특별시</td>
                <td th:text="${#temporals.format(volunteer.startTime, 'yyyy-MM-dd HH:mm')}">2025-10-24 10:00</td>
                <td th:text="${#temporals.format(volunteer.endTime, 'yyyy-MM-dd HH:mm')}">2025-10-24 17:00</td>
                <td><span class="badge bg-warning text-dark">PENDING</span></td>

                <!-- ✅ 상태 변경 -->
                <td>
                    <select th:id="'status-' + ${volunteer.volunteerId}"
                            class="form-select form-select-sm w-auto mb-2"
                            th:value="${volunteer.status}">
                        <option value="PENDING" selected>보류</option>
                        <option value="APPROVED">승인</option>
                        <option value="REJECTED">거절</option>
                    </select>

                    <button type="button"
                            class="btn btn-sm btn-outline-primary"
                            th:attr="data-id=${volunteer.volunteerId}"
                            onclick="changeVolunteerStatus(this)">변경</button>
                </td>
            </tr>

            <!-- ✅ 보류 중인 봉사글이 없을 경우 -->
            <tr th:if="${#lists.isEmpty(volunteerList) or #lists.isEmpty(volunteerList.?[status == 'PENDING'])}">
                <td colspan="7" class="text-muted py-4">보류 중인 봉사글이 없습니다.</td>
            </tr>

            </tbody>
        </table>
    </div>
</main>

<!-- ✅ JavaScript -->
<script>
    function changeVolunteerStatus(button) {
        const id = button.getAttribute('data-id');
        const selectElement = document.getElementById('status-' + id);

        if (!selectElement) {
            alert('선택 요소를 찾을 수 없습니다.');
            return;
        }

        const status = selectElement.value;
        let rejectReason = '';

        if (status === 'REJECTED') {
            rejectReason = prompt('거절 사유를 입력해주세요 (선택 사항)') || '';
        }

        if (!confirm('정말로 상태를 변경하시겠습니까?')) return;

        const params = new URLSearchParams();
        params.append('volunteerId', id);
        params.append('status', status);
        if (rejectReason) params.append('rejectReason', rejectReason);

        fetch('/admin/volunteer-status-update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        })
            .then(res => res.text())
            .then(() => {
                alert('상태가 성공적으로 변경되었습니다.');
                location.reload();
            })
            .catch(() => alert('오류가 발생했습니다. 다시 시도해주세요.'));
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
