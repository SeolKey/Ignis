<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 리스트 (관리자용)</title>

    <!-- ✅ Bootstrap CDN -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <!-- ✅ 공통 스타일 -->
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>

<body>
<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">회원 목록 (관리자용)</h2>
        <a href="/admin/main" class="btn btn-outline-secondary">← 관리자 메인으로</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>권한</th>
                <th>가입일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user, iterStat : ${userList}">
                <td th:text="${iterStat.index + 1}">1</td>
                <td th:text="${user.userLoginId}">test123</td>
                <td th:text="${user.name}">홍길동</td>
                <td th:text="${user.email}">test@example.com</td>
                <td th:text="${user.phoneNumber}">010-1234-5678</td>
                <td>
                            <span th:text="${user.role}"
                                  th:classappend="${user.role.toLowerCase() == 'admin'} ? 'badge bg-danger' : 'badge bg-secondary'">
                                USER
                            </span>
                </td>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2025-05-01 14:00</td>
            </tr>

            <tr th:if="${#lists.isEmpty(userList)}">
                <td colspan="7" class="text-muted py-4">등록된 회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
