<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>봉사글 상세 보기 (관리자용)</title>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- ✅ 공통 스타일 -->
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>
<body>

<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h2 class="fw-bold">봉사글 상세 정보 (관리자용)</h2>
        <a href="/admin/volunteer-list-view" class="btn btn-outline-secondary mt-2">← 목록으로 돌아가기</a>
    </div>

    <div class="card shadow-sm p-4">
        <p><strong>ID:</strong> <span th:text="${volunteer.volunteerId}"></span></p>
        <p><strong>작성자:</strong> <span th:text="${volunteer.userId}"></span></p>
        <p><strong>제목:</strong> <span th:text="${volunteer.title}"></span></p>
        <p><strong>설명:</strong> <span th:text="${volunteer.description}"></span></p>
        <p><strong>위치:</strong> <span th:text="${volunteer.location}"></span></p>
        <p>
            <strong>시작 시간:</strong>
            <span th:text="${#temporals.format(volunteer.startTime, 'yyyy-MM-dd HH:mm')}"></span>
        </p>
        <p>
            <strong>종료 시간:</strong>
            <span th:text="${#temporals.format(volunteer.endTime, 'yyyy-MM-dd HH:mm')}"></span>
        </p>
        <p><strong>최대 인원:</strong> <span th:text="${volunteer.maxParticipants}"></span> 명</p>

        <!-- ✅ 상태 표시 -->
        <p>
            <strong>상태:</strong>
            <span th:switch="${volunteer.status}">
                <span th:case="'APPROVED'" class="badge bg-success" th:text="${volunteer.status}"></span>
                <span th:case="'REJECTED'" class="badge bg-danger" th:text="${volunteer.status}"></span>
                <span th:case="*" class="badge bg-warning text-dark" th:text="${volunteer.status}"></span>
            </span>
        </p>
    </div>

    <hr class="my-4">

    <!-- ✅ 상태 변경 폼 -->
    <form th:action="@{/admin/volunteer-status-update}"
          method="post"
          class="d-flex align-items-center gap-2">
        <input type="hidden" name="volunteerId" th:value="${volunteer.volunteerId}" />

        <label for="status" class="form-label fw-semibold mb-0">상태 변경:</label>
        <select name="status" id="status" class="form-select w-auto">
            <option value="PENDING" th:selected="${volunteer.status eq 'PENDING'}">보류</option>
            <option value="APPROVED" th:selected="${volunteer.status eq 'APPROVED'}">승인</option>
            <option value="REJECTED" th:selected="${volunteer.status eq 'REJECTED'}">거절</option>
        </select>

        <button type="submit" class="btn btn-outline-primary">변경</button>
    </form>
</main>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>
</html>
