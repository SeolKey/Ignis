<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>기부글 상세 보기</title>
</head>
<body>
<h1>관리자 - 기부글 상세 정보</h1>

<div>
    <p><strong>ID:</strong> <span th:text="${funding.donationId}"></span></p>
    <p><strong>작성자:</strong> <span th:text="${funding.userId}"></span></p>
    <p><strong>제목:</strong> <span th:text="${funding.title}"></span></p>
    <p><strong>설명:</strong> <span th:text="${funding.description}"></span></p>
    <p><strong>계좌정보:</strong> <span th:text="${funding.accountInfo}"></span></p>
    <p><strong>목표 금액:</strong> <span th:text="${funding.maxPrice}"></span>원</p>
    <p><strong>현재 금액:</strong> <span th:text="${funding.currentPrice}"></span>원</p>
    <p><strong>상태:</strong> <span th:text="${funding.status}"></span></p>
    <p><strong>작성일:</strong> <span th:text="${#temporals.format(funding.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
</div>

<hr>

<form th:action="@{/admin/funding-status-update}" method="post">
    <input type="hidden" name="fundingId" th:value="${funding.fundingId}" />
    <label for="status">상태 변경:</label>
    <select name="status" id="status">
        <option value="PENDING" th:selected="${funding.status == 'PENDING'}">보류</option>
        <option value="APPROVED" th:selected="${funding.status == 'APPROVED'}">승인</option>
        <option value="REJECTED" th:selected="${funding.status == 'REJECTED'}">거절</option>
    </select>
    <button type="submit">변경</button>
</form>

<p><a th:href="@{/admin/funding-list-view}">← 목록으로 돌아가기</a></p>
</body>
</html>
