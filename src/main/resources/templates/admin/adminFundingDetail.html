<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>펀딩글 상세 보기 (관리자용)</title>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- ✅ 공통 스타일 -->
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>
<body>

<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h2 class="fw-bold">펀딩글 상세 정보 (관리자용)</h2>
        <a href="/admin/funding-list-view" class="btn btn-outline-secondary mt-2">← 목록으로 돌아가기</a>
    </div>

    <div class="card shadow-sm p-4">
        <p><strong>ID:</strong> <span th:text="${funding.fundingId}"></span></p>
        <p><strong>작성자:</strong> <span th:text="${funding.userId}"></span></p>
        <p><strong>제목:</strong> <span th:text="${funding.title}"></span></p>
        <p><strong>설명:</strong> <span th:text="${funding.description}"></span></p>

        <!-- ⚠️ 계좌정보 필드 제거 (Funding에 없음)
        <p><strong>계좌정보:</strong> <span th:text="${funding.accountInfo}"></span></p>
        -->

        <p>
            <strong>목표 금액:</strong>
            <span th:text="${#numbers.formatInteger(funding.maxPrice, 0, 'COMMA')}"></span> 원
        </p>
        <p>
            <strong>현재 금액:</strong>
            <span th:text="${#numbers.formatInteger(funding.currentPrice, 0, 'COMMA')}"></span> 원
        </p>

        <!-- ✅ 상태 표시 -->
        <p>
            <strong>상태:</strong>
            <span th:switch="${funding.status}">
                <span th:case="'APPROVED'" class="badge bg-success" th:text="${funding.status}"></span>
                <span th:case="'REJECTED'" class="badge bg-danger" th:text="${funding.status}"></span>
                <span th:case="*" class="badge bg-warning text-dark" th:text="${funding.status}"></span>
            </span>
        </p>

        <p><strong>조회수:</strong> <span th:text="${funding.viewCount}"></span></p>
        <p>
            <strong>작성일:</strong>
            <span th:text="${#temporals.format(funding.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
        </p>
    </div>

    <hr class="my-4">

    <!-- ✅ 상태 변경 폼 -->
    <form th:action="@{/admin/funding-status-update}"
          method="post"
          class="d-flex align-items-center gap-2">
        <input type="hidden" name="fundingId" th:value="${funding.fundingId}" />

        <label for="status" class="form-label fw-semibold mb-0">상태 변경:</label>
        <select name="status" id="status" class="form-select w-auto">
            <option value="PENDING" th:selected="${funding.status eq 'PENDING'}">보류</option>
            <option value="APPROVED" th:selected="${funding.status eq 'APPROVED'}">승인</option>
            <option value="REJECTED" th:selected="${funding.status eq 'REJECTED'}">거절</option>
        </select>

        <button type="submit" class="btn btn-outline-primary">변경</button>
    </form>
</main>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>
</html>
