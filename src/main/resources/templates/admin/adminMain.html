<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 메인 페이지</title>

    <!-- ✅ Bootstrap CDN -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <!-- ✅ 공통 스타일 -->
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>
<body>

<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container text-center mt-5">
    <h1 class="fw-bold mb-4">관리자 대시보드</h1>

    <div class="row justify-content-center g-3">
        <div class="col-md-3">
            <button class="btn btn-primary w-100"
                    onclick="location.href='/admin/user-list-view'">
                회원 목록 보기
            </button>
        </div>
        <div class="col-md-3">
            <button class="btn btn-secondary w-100"
                    onclick="location.href='/admin/post-list-view'">
                게시글 목록 보기
            </button>
        </div>
        <div class="col-md-3">
            <button class="btn btn-success w-100"
                    onclick="location.href='/admin/donation-list-view'">
                기부 목록 보기
            </button>
        </div>
        <div class="col-md-3">
            <button class="btn btn-warning w-100"
                    onclick="location.href='/admin/funding-list-view'">
                펀딩 목록 보기
            </button>
        </div>

        <!-- ✅ 추가: 긴급 관리 버튼 -->
        <div class="col-md-3">
            <button class="btn btn-danger w-100"
                    onclick="location.href='/admin/emergency-manage'">
                🔥 긴급 관리 (기부 / 펀딩 / 봉사)
            </button>
        </div>
    </div>

    <hr class="my-5">

    <div class="text-muted">
        <p>관리자 권한으로 시스템 전반을 관리할 수 있습니다.</p>
        <p>필요 시 사용자, 게시글, 기부·펀딩 항목을 검토하거나 <strong>긴급 관리</strong> 기능을 활용하세요.</p>
    </div>
</main>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>
</html>
