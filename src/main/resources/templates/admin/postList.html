<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록 (관리자용)</title>

    <!-- ✅ Bootstrap CDN -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <!-- ✅ 공통 스타일 -->
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />

    <script>
        function deletePost(postId) {
            if (!confirm("정말로 삭제하시겠습니까?")) return;

            fetch("/admin/delete-post/" + postId, { method: "DELETE" })
                .then(response => response.json())
                .then(data => {
                    alert(data.result || data.error);
                    location.reload();
                })
                .catch(error => {
                    console.error("삭제 실패:", error);
                    alert("삭제 중 오류 발생");
                });
        }
    </script>
</head>

<body>
<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">게시글 목록 (관리자용)</h2>
        <a href="/admin/main" class="btn btn-outline-secondary">← 관리자 메인으로</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자 ID</th>
                <th>작성일</th>
                <th>상세</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post, iterStat : ${postList}">
                <td th:text="${iterStat.index + 1}">1</td>
                <td th:text="${post.title}">샘플 제목</td>
                <td th:text="${post.userId}">1</td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2025-05-19</td>
                <td>
                    <a th:href="@{'/admin/post-detail-view/' + ${post.postId}}"
                       class="btn btn-sm btn-outline-primary">보기</a>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-danger"
                            th:onclick="'deletePost(' + ${post.postId} + ')'">삭제</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(postList)}">
                <td colspan="6" class="text-muted py-4">등록된 게시글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
