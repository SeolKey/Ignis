<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부글 목록 (관리자용)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>

<body>
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">기부글 목록 (관리자용)</h2>
        <a href="/admin/main" class="btn btn-outline-secondary">← 관리자 메인으로</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>작성자</th>
                <th>상태</th>
                <th>조회수</th>
                <th>작성일</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <!-- ✅ 상태가 PENDING인 기부글만 출력 -->
            <tr th:each="donation : ${donationList}" th:if="${donation.status == 'PENDING'}">
                <td th:text="${donation.donationId}">1</td>
                <td>
                    <a th:href="@{'/admin/donation-detail-view/' + ${donation.donationId}}"
                       th:text="${donation.title}"
                       class="text-decoration-none fw-semibold text-primary"></a>
                </td>
                <td th:text="${donation.userId}">1</td>

                <td>
                    <span th:switch="${donation.status}">
                        <span th:case="'APPROVED'" class="badge bg-success" th:text="${donation.status}"></span>
                        <span th:case="'REJECTED'" class="badge bg-danger" th:text="${donation.status}"></span>
                        <span th:case="*" class="badge bg-warning text-dark" th:text="${donation.status}"></span>
                    </span>
                </td>

                <td th:text="${donation.viewCount}">0</td>
                <td th:text="${#temporals.format(donation.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                <!-- ✅ 상태 변경 -->
                <td>
                    <select th:id="'status-' + ${donation.donationId}"
                            class="form-select form-select-sm w-auto d-inline mb-1"
                            th:value="${donation.status}">
                        <option value="PENDING" th:selected="${donation.status eq 'PENDING'}">보류</option>
                        <option value="APPROVED" th:selected="${donation.status eq 'APPROVED'}">승인</option>
                        <option value="REJECTED" th:selected="${donation.status eq 'REJECTED'}">거절</option>
                    </select>

                    <button type="button"
                            class="btn btn-sm btn-outline-primary"
                            th:attr="data-id=${donation.donationId}"
                            onclick="changeDonationStatus(this)">변경</button>
                </td>
            </tr>

            <!-- ✅ 보류 중인 기부글이 없을 경우 -->
            <tr th:if="${#lists.isEmpty(donationList) or #lists.isEmpty(donationList.?[status == 'PENDING'])}">
                <td colspan="7" class="text-muted py-4">보류 중인 기부글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- ✅ JS -->
<script>
    function changeDonationStatus(button) {
        const id = button.getAttribute('data-id');
        const select = document.getElementById('status-' + id);

        if (!select) {
            alert('상태 선택 요소를 찾을 수 없습니다.');
            return;
        }

        const status = select.value;

        if (!confirm('정말로 상태를 변경하시겠습니까?')) return;

        const params = new URLSearchParams();
        params.append('donationId', id);
        params.append('status', status);

        fetch('/admin/donation-status-update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        })
            .then(res => res.text())
            .then(() => {
                alert('상태가 성공적으로 변경되었습니다.');
                location.reload();
            })
            .catch(() => alert('오류가 발생했습니다. 다시 시도해주세요.'));
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
