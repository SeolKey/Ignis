<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부글 목록 (관리자용)</title>

    <!-- ✅ Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">

    <!-- ✅ 공통 스타일 -->
    <th:block th:replace="~{fragments/headerStyle :: headerStyle}" />
</head>

<body>
<!-- ✅ 공통 헤더 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">기부글 목록 (관리자용)</h2>
        <a href="/admin/main" class="btn btn-outline-secondary">← 관리자 메인으로</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>작성자</th>
                <th>상태</th>
                <th>조회수</th>
                <th>작성일</th>
                <th>긴급 여부</th> <!-- ✅ 새로 추가 -->
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="donation : ${donationList}">
                <td th:text="${donation.donationId}">1</td>

                <td>
                    <a th:href="@{'/admin/donation-detail-view/' + ${donation.donationId}}"
                       th:text="${donation.title}"
                       class="text-decoration-none fw-semibold text-primary">
                        샘플 제목
                    </a>
                </td>

                <td th:text="${donation.userId}">1</td>

                <!-- ✅ 상태 뱃지 -->
                <td>
                    <span th:switch="${donation.status}">
                        <span th:case="'APPROVED'" class="badge bg-success" th:text="${donation.status}"></span>
                        <span th:case="'REJECTED'" class="badge bg-danger" th:text="${donation.status}"></span>
                        <span th:case="*" class="badge bg-warning text-dark" th:text="${donation.status}"></span>
                    </span>
                </td>

                <td th:text="${donation.viewCount}">0</td>
                <td th:text="${#temporals.format(donation.createdAt, 'yyyy-MM-dd HH:mm')}">2025-05-19</td>

                <!-- ✅ 긴급 여부 표시 -->
                <td>
                    <span th:if="${donation.isEmergency == 1}" class="badge bg-danger">긴급</span>
                    <span th:if="${donation.isEmergency == 0}" class="badge bg-secondary">일반</span>
                </td>

                <!-- ✅ 관리 버튼 영역 -->
                <td>
                    <!-- 상태 변경 폼 -->
                    <form th:action="@{'/admin/donation-status-update'}" method="post" class="d-inline">
                        <input type="hidden" name="donationId" th:value="${donation.donationId}" />
                        <select name="status" class="form-select form-select-sm d-inline w-auto">
                            <option value="PENDING" th:selected="${donation.status eq 'PENDING'}">보류</option>
                            <option value="APPROVED" th:selected="${donation.status eq 'APPROVED'}">승인</option>
                            <option value="REJECTED" th:selected="${donation.status eq 'REJECTED'}">거절</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline-primary ms-1">변경</button>
                    </form>

                    <!-- 삭제 버튼 -->
                    <form th:action="@{'/admin/donation-delete/' + ${donation.donationId}}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('정말 삭제하시겠습니까?');">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="submit" class="btn btn-sm btn-outline-danger ms-1">삭제</button>
                    </form>

                    <!-- ✅ 긴급 설정/해제 버튼 -->
                    <form th:action="@{'/admin/donation-toggle-emergency/' + ${donation.donationId}}"
                          method="post"
                          class="d-inline">
                        <input type="hidden" name="isEmergency"
                               th:value="${donation.isEmergency == 1 ? 0 : 1}" />
                        <button type="submit"
                                th:text="${donation.isEmergency == 1 ? '긴급 해제' : '긴급 설정'}"
                                th:classappend="${donation.isEmergency == 1 ? 'btn btn-sm btn-outline-warning ms-1' : 'btn btn-sm btn-outline-danger ms-1'}">
                            긴급 설정
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(donationList)}">
                <td colspan="8" class="text-muted py-4">등록된 기부글이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
