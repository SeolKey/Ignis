<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기부 작성</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- ✅ 공통 헤더 삽입 -->
    <div th:replace="~{fragments/header :: commonHeader}"></div>

    <h1>기부 글 작성</h1>
    <form id="donationForm">
        <input type="text" name="title" id="title" placeholder="제목" required><br>
        <textarea name="description" id="description" placeholder="설명" required></textarea><br>
        <input type="text" name="accountInfo" id="accountInfo" placeholder="계좌"><br>
        <input type="number" name="maxPrice" id="maxPrice" placeholder="목표 금액"><br>
        <input type="number" name="currentPrice" id="currentPrice" value="0"><br>
        <input type="text" name="rejectReason" id="rejectReason" placeholder="거절 사유"><br>
        <input type="text" name="imagePath" id="imagePath" placeholder="이미지 경로"><br>
        <button type="submit">작성하기</button>
    </form>

    <script>
	    $("#donationForm").submit(function(e) {
	        e.preventDefault();
	
	        const data = {
	            title: $("input[name='title']").val(),
	            description: $("textarea[name='description']").val(),
	            accountInfo: $("input[name='accountInfo']").val(),
	            maxPrice: parseInt($("input[name='maxPrice']").val(), 10),
	            currentPrice: parseInt($("input[name='currentPrice']").val(), 10),
	            imagePath: $("input[name='imagePath']").val(),
	            rejectReason: $("input[name='rejectReason']").val() || ""
	        };
	
	        $.ajax({
	            url: "/donation/create",
	            method: "POST",
	            contentType: "application/json",
	            data: JSON.stringify(data),
	            dataType: "json",
	            xhrFields: {
	                withCredentials: true
	            },
	            success: function(response) {
	                if (response.result === "success") {
	                    alert("글 작성 성공!");
	                    location.href = "/donation/donation-list-view";
	                } else {
	                    alert("글 작성 실패: " + (response.error_message || "알 수 없는 오류"));
	                }
	            },
	            error: function(xhr) {
	                if (xhr.status === 401) {
	                    alert("로그인이 필요합니다. 로그인 후 이용해주세요.");
	                    window.location.href = "/user/login";
	                } else {
	                    alert("글 작성 실패: " + (xhr.responseJSON?.error_message || "서버 오류"));
	                }
	            }
	        });
	    });
	</script>



</body>
</html>
