<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>기부 등록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        form input[type="text"],
        form input[type="number"],
        form input[type="file"],
        form textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        form textarea {
            height: 100px;
        }

        .btn-submit {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #1c7430;
        }
    </style>
</head>
<body>

<!-- ✅ 공통 헤더 삽입 -->
<div th:replace="~{fragments/header :: commonHeader}"></div>

<div class="container">
    <h1>기부 등록</h1>

    <form id="donationForm" enctype="multipart/form-data">
        <label for="title">제목</label>
        <input type="text" id="title" name="title" required>

        <label for="description">설명</label>
        <textarea id="description" name="description" required></textarea>

        <label for="accountInfo">계좌</label>
        <input type="text" id="accountInfo" name="accountInfo">

        <label for="maxPrice">목표 금액</label>
        <input type="number" id="maxPrice" name="maxPrice">

        <input type="hidden" id="currentPrice" name="currentPrice" value="0">
        <input type="hidden" id="rejectReason" name="rejectReason" value="">

        <label for="file">이미지 업로드</label>
        <input type="file" id="file" name="file">

        <button type="submit" class="btn-submit">작성하기</button>
    </form>
</div>

<script>
    const form = document.getElementById("donationForm");
    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(form);

        fetch("/donation/create", {
            method: "POST",
            body: formData
        }).then(res => res.json())
          .then(data => {
              if (data.code === 1 || data.result === "success") {
                  alert("기부 등록 성공!");
                  window.location.href = "/donation/donation-list-view";
              } else {
                  alert("등록 실패: " + (data.errorMessage || "서버 오류"));
              }
          })
          .catch(err => {
              alert("서버 오류 발생: " + err);
          });
    });
</script>

</body>
</html>
