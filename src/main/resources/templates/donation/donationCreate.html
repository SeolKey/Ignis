<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>기부 글 작성</title>
    <script>
        async function submitDonation(event) {
            event.preventDefault();

            const title      = document.getElementById("title").value;
            const description= document.getElementById("description").value;
            const accountInfo= document.getElementById("accountInfo").value;
            const maxPrice   = document.getElementById("maxPrice").value;
            const imageFile  = document.getElementById("imageFile").files[0];

            const formData = new FormData();
            formData.append("title", title);
            formData.append("description", description);
            formData.append("accountInfo", accountInfo);
            formData.append("maxPrice", maxPrice);
            if (imageFile) {
                formData.append("imageFile", imageFile);
            }

            try {
                const response = await fetch("/donation/create", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (data.result === "성공") {
                    alert("기부 등록이 완료되었습니다.");
                    window.location.href = "/donation/donation-list-view";
                } else {
                    alert("오류: " + (data.error || "알 수 없는 오류"));
                }
            } catch (err) {
                alert("서버 요청 중 오류가 발생했습니다.");
                console.error(err);
            }
        }
    </script>
</head>
<body>
<h1>기부 글 작성</h1>

<form onsubmit="submitDonation(event)" enctype="multipart/form-data">
    <label>제목: <input type="text" id="title" name="title" required></label><br><br>
    <label>설명: <textarea id="description" name="description" rows="5" cols="50" required></textarea></label><br><br>
    <label>계좌 정보: <input type="text" id="accountInfo" name="accountInfo" required></label><br><br>
    <label>목표 금액: <input type="number" id="maxPrice" name="maxPrice" required></label><br><br>
    <label>이미지: <input type="file" id="imageFile" name="imageFile" accept="image/*"></label><br><br>
    <input type="submit" value="등록">
</form>

<a th:href="@{/donation/donation-list-view}">목록으로</a>
</body>
</html>
