<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="fragments/headerStyle :: headerStyle" />
  <meta charset="UTF-8">
  <title>기부 상세</title>

  <!-- Bootstrap CSS (프로젝트에 이미 포함되어 있다면 중복 포함되지 않게 확인) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      display: flex;
      gap: 30px;
    }
    .left-section {
      flex: 2;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
    .left-section img {
      width: 100%;
      border-radius: 12px;
    }
    .tabs {
      display: flex;
      margin-top: 16px;
      gap: 24px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
    }
    .tabs .active {
      color: #0d6efd;
      border-bottom: 2px solid #0d6efd;
    }
    .tab-content {
      margin-top: 20px;
    }
    .right-section {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
    .right-section h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    .progress-bar-bg {
      background: #e9ecef;
      border-radius: 8px;
      height: 10px;
      width: 100%;
      margin: 10px 0;
    }
    .progress-bar-fill {
      background: #0d6efd;
      height: 100%;
      width: 60%;
      border-radius: 8px;
    }
    .stats {
      margin: 20px 0;
    }
    .stats p {
      margin: 4px 0;
    }
    .btn {
      text-align: center;
      background-color: #0d6efd;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
    }
    .share-box {
      margin-top: 12px;
      text-align: center;
    }
    .share-box button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }
    .section-title {
      font-weight: bold;
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 12px;
    }
    .project-description {
      min-height: 200px;
      background: #e9ecef;
      border-radius: 10px;
      padding: 10px;
      white-space: pre-wrap;
    }
    .comment-form .btn {
      width: auto !important;
      min-width: 80px;
    }
    .comment-textarea {
      width: 80%;
      min-height: 100px;
      resize: vertical;
    }

    /* ===== 댓글/답글 스타일 ===== */
    .comment {
      margin-bottom: 1rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid #ddd;
    }
    .comment .meta {
      font-size: 0.85rem;
      color: #666;
    }
    .reply {
      margin-top: .5rem;
      margin-left: 1.5rem;
      padding: .5rem .75rem;
      background: #f9f9f9;
      border-left: 3px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .reply .meta {
      font-size: 0.75rem;
      color: #888;
    }

    /* 🎨 모달 등장 애니메이션 (스르륵) */
    .modal.fade .modal-dialog {
      transform: translateY(-30%);
      transition: transform 0.3s ease-out;
    }
    .modal.fade.show .modal-dialog {
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/header :: commonHeader}"></div>

<div class="container">
  <div class="left-section">
    <img th:src="@{${donation.imagePath}}" alt="기부 이미지">
    <div class="tabs">
      <div class="tab active" data-tab="detail">상세내용</div>
      <div class="tab" data-tab="notice">안내사항</div>
      <div class="tab" data-tab="comment">댓글</div>
    </div>

    <div class="tab-content" id="tab-detail">
      <div class="section-title">프로젝트 소개</div>
      <div class="project-description" th:text="${donation.description}">기부 설명</div>
      <div class="section-title">계좌 정보</div>
      <p th:text="${donation.accountInfo}">은행 계좌</p>
    </div>

    <div class="tab-content" id="tab-notice" style="display: none;">
      <div class="section-title">안내사항</div>
      <div class="project-description">여기에 안내사항 내용을 넣으세요.</div>
    </div>

    <div class="tab-content" id="tab-comment" style="display: none;">
      <div class="section-title">댓글</div>
      <div id="comment-list" class="mb-4"></div>
      <div class="comment-form card shadow-sm p-3 mb-4">
        <div class="d-flex align-items-start">
          <img src="/static/images/default_profile.png" class="rounded-circle me-3 mt-1" width="40" height="40" alt="profile">
          <div class="flex-grow-1">
            <div class="d-flex w-100 mb-2">
              <textarea id="comment-content" class="form-control comment-textarea me-2 w-100" placeholder="댓글을 입력하세요"></textarea>
              <button id="comment-submit" class="btn btn-primary align-self-start">발송</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="right-section">
    <h2 th:text="${donation.title}">기부 제목</h2>
    <p th:text="'📅 ' + ${#temporals.format(donation.createdAt, 'yyyy.MM.dd')} + ' ~ ' + ${#temporals.format(donation.createdAt.plusDays(60), 'yyyy.MM.dd')} + ' (60일)'"></p>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" th:style="'width:' + (${donation.currentPrice} * 100 / ${donation.maxPrice}) + '%'" ></div>
    </div>
    <div style="color: #0d6efd; font-weight: bold;">
      <span th:text="(${donation.currentPrice} * 100 / ${donation.maxPrice}) + '%'">60%</span> 달성
    </div>
    <div class="stats">
      <p><strong>현재 금액:</strong> <span th:text="${#numbers.formatDecimal(donation.currentPrice, 0, 0)} + '원'"></span></p>
      <p><strong>목표 금액:</strong> <span th:text="${#numbers.formatDecimal(donation.maxPrice, 0, 0)} + '원'"></span></p>
    </div>
    <a th:href="@{/donation/participate-view(donationId=${donation.donationId})}" class="btn">기부하기</a>
    <div class="share-box">
      <button onclick="navigator.share ? navigator.share({ title: '기부 공유', url: window.location.href }) : alert('공유 기능을 지원하지 않는 브라우저입니다.')">공유하기</button>
    </div>
  </div>
</div>

<!-- 전화번호 입력 모달 -->
<div class="modal fade" id="phoneModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">연락처 확인</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
      </div>
      <div class="modal-body">
        <label for="phoneInput" class="form-label">전화번호</label>
        <input id="phoneInput" type="text" class="form-control" placeholder="000-0000-0000" inputmode="numeric">
        <div id="phoneHelp" class="form-text">하이픈 포함 예: 010-1234-5678</div>
        <div id="phoneError" class="text-danger mt-2" style="display:none;">형식이 올바르지 않습니다.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" id="confirmPhoneBtn">확인</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (bundle: Popper 포함) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function () {
  const tabs = document.querySelectorAll('.tab');
  const contents = document.querySelectorAll('.tab-content');
  const contentId = /*[[${donation.donationId}]]*/ 0;
  const contentType = "donation";

  // ===== 탭 전환 =====
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const targetId = 'tab-' + tab.dataset.tab;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      contents.forEach(c => {
        c.style.display = (c.id === targetId) ? 'block' : 'none';
      });
      if (tab.dataset.tab === 'comment') {
        loadComments();
      }
    });
  });

  // ===== 댓글 전체 로드 =====
  function loadComments() {
    fetch(`/comment/list?contentType=${contentType}&contentId=${contentId}`)
      .then(res => res.json())
      .then(async data => {
        const container = document.getElementById('comment-list');
        container.innerHTML = "";
        if (!data || data.length === 0) {
          container.innerHTML = "<p class='text-muted'>아직 댓글이 없습니다.</p>";
          return;
        }
        for (const c of data) {
          const div = document.createElement('div');
          div.className = 'comment';
          div.innerHTML = `
            <div class="fw-bold">${c.userName || '익명 사용자'}</div>
            <div>${escapeHtml(c.content)}</div>
            <div class="meta">${(c.createdAt || '').replace("T", " ").substring(0, 16)}</div>
            <button class="btn btn-sm btn-outline-primary reply-btn mt-1" data-id="${c.commentId}">답글쓰기</button>
            <div class="replies mt-2" id="replies-${c.commentId}"></div>
          `;
          container.appendChild(div);
          loadReplies(c.commentId);
        }
      })
      .catch(err => {
        console.error("댓글 불러오기 실패:", err);
        document.getElementById('comment-list').innerHTML = "<p class='text-danger'>댓글을 불러오는 데 실패했습니다.</p>";
      });
  }

  // ===== 대댓글 로드 =====
  function loadReplies(parentId) {
    fetch(`/comment/replies?parentId=${parentId}`)
      .then(res => res.json())
      .then(replies => {
        const container = document.getElementById(`replies-${parentId}`);
        container.innerHTML = "";
        replies.forEach(r => {
          const rdiv = document.createElement('div');
          rdiv.className = 'reply';
          rdiv.innerHTML = `
            <div class="fw-bold">${r.userName || '익명 사용자'}</div>
            <div>${escapeHtml(r.content)}</div>
            <div class="meta">${(r.createdAt || '').replace("T", " ").substring(0, 16)}</div>
          `;
          container.appendChild(rdiv);
        });
      });
  }

  // ===== 댓글 등록 =====
  document.getElementById("comment-submit").addEventListener("click", () => {
    const content = document.getElementById("comment-content").value.trim();
    if (!content) {
      alert("댓글 내용을 입력해주세요.");
      return;
    }
    fetch("/comment/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contentType: contentType,
        contentId: contentId,
        content: content,
        parentId: null
      })
    }).then(res => res.json())
      .then(result => {
        if (result.result === "success") {
          document.getElementById("comment-content").value = "";
          loadComments();
          // 댓글 탭이 보장되도록
          showTab('comment');
        } else {
          alert(result.errorMessage || "댓글 등록에 실패했습니다.");
        }
      });
  });

  // ===== 답글 토글 및 등록(이벤트 위임) =====
  document.addEventListener("click", (e) => {
    if (e.target.classList.contains("reply-btn")) {
      const parentId = e.target.dataset.id;
      const repliesDiv = document.getElementById(`replies-${parentId}`);
      const existing = repliesDiv.querySelector(".reply-form");
      if (existing) { existing.remove(); return; }
      const form = document.createElement("div");
      form.className = "reply-form input-group mb-2";
      form.innerHTML = `
        <input type="text" class="form-control reply-input" placeholder="답글을 입력하세요">
        <button class="btn btn-primary send-reply" data-parent="${parentId}">등록</button>
      `;
      repliesDiv.prepend(form);
    }

    if (e.target.classList.contains("send-reply")) {
      const parentId = e.target.dataset.parent;
      const input = e.target.closest(".reply-form").querySelector(".reply-input");
      const content = (input.value || "").trim();
      if (!content) return;

      fetch("/comment/reply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contentType: contentType,
          contentId: contentId,
          content: content,
          parentId: parentId
        })
      }).then(res => res.json())
        .then(result => {
          if (result.result === "success") {
            loadReplies(parentId);
          } else {
            alert(result.errorMessage || "대댓글 등록에 실패했습니다.");
          }
        });
    }
  });

  function showTab(tabKey) {
    tabs.forEach(t => t.classList.remove('active'));
    contents.forEach(c => c.style.display = 'none');
    const activeTab = document.querySelector(`.tab[data-tab="${tabKey}"]`);
    const activeContent = document.getElementById(`tab-${tabKey}`);
    if (activeTab) activeTab.classList.add('active');
    if (activeContent) activeContent.style.display = 'block';
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
  }

  /* ====== 기부하기 (조건부 모달) ====== */
  const donateBtn = document.getElementById("donateBtn");
  const phoneModalEl = document.getElementById("phoneModal");
  const phoneModal = new bootstrap.Modal(phoneModalEl);
  const phoneInput = document.getElementById("phoneInput");
  const phoneError = document.getElementById("phoneError");
  const confirmPhoneBtn = document.getElementById("confirmPhoneBtn");

  // Bootstrap 모달 열릴 때 입력 포커스
  phoneModalEl.addEventListener('shown.bs.modal', () => {
    phoneInput.focus();
  });

  const phoneRegex = /^01[0-9]-\d{3,4}-\d{4}$/;

  // 기부하기 버튼 클릭 시
  donateBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      const res = await fetch("/user/me/phone");
      const data = await res.json();
      const phone = data.phone || "000-0000-0000";

      if (phone === "000-0000-0000") {
        // 기본값이면 모달 띄워서 수정 유도
        phoneInput.value = phone;
        phoneError.style.display = "none";
        phoneModal.show();
      } else {
        // 정상 번호면 바로 참여
        const res2 = await fetch(`/donation/${contentId}/participate`, { method: "POST" });
        const ok = res2.ok ? await res2.json() : { result: "fail" };
        if (ok.result === "success") {
          // 참여 완료 페이지로 이동하려면 아래 redirect 사용
          // window.location.href = `/donation/complete/${contentId}`;
          location.reload();
        } else {
          alert(ok.error_message || "기부 참여에 실패했습니다.");
        }
      }
    } catch (err) {
      console.error(err);
      alert("전화번호 확인 중 오류가 발생했습니다.");
    }
  });

  // 모달에서 확인 클릭 시
  confirmPhoneBtn.addEventListener("click", async () => {
    const phone = (phoneInput.value || "").trim();
    if (!phoneRegex.test(phone)) {
      phoneError.style.display = "block";
      return;
    }
    phoneError.style.display = "none";

    try {
      const res = await fetch("/user/me/phone", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone })
      });
      const result = await res.json();
      if (result.result === "success") {
        phoneModal.hide();
        const res2 = await fetch(`/donation/${contentId}/participate`, { method: "POST" });
        const ok = res2.ok ? await res2.json() : { result: "fail" };
        if (ok.result === "success") {
          // window.location.href = `/donation/complete/${contentId}`;
          location.reload();
        } else {
          alert(ok.error_message || "기부 참여에 실패했습니다.");
        }
      } else {
        alert("전화번호 업데이트 실패");
      }
    } catch (err) {
      console.error(err);
      alert("요청 처리 중 오류가 발생했습니다.");
    }
  });
});
</script>

</body>
</html>
