<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>글 작성</title>
    <script>
        function submitPost(event) {
            event.preventDefault();

            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;

            // FormData로 전송 (헤더 수동 지정 X)
            const fd = new FormData();
            fd.append("title", title);
            fd.append("content", content);

            // 파일 입력(id가 file 또는 image인 경우 모두 대응)
            const fileInput =
                document.getElementById("file") || document.getElementById("image");
            if (fileInput && fileInput.files && fileInput.files[0]) {
                fd.append("file", fileInput.files[0]); // 서버에서 @RequestParam("file")
            }

            fetch("/post/create", {
                method: "POST",
                body: fd,             // ← Content-Type 자동(boundary 포함). 절대 직접 지정하지 마세요.
                credentials: "include"
            })
                .then(res => res.json())
                .then(data => {
                    if (data.result === "성공") {
                        alert("글이 등록되었습니다.");
                        window.location.href = "/post/post-list-view";
                    } else {
                        alert("오류: " + (data.error || "서버 오류"));
                    }
                })
                .catch(() => alert("서버 오류"));
        }
    </script>
</head>
<body>
<div th:replace="~{fragments/header :: commonHeader}"></div>
<h1>글 작성</h1>
<form onsubmit="submitPost(event)">
    <label>제목:</label><br>
    <input type="text" id="title" name="title"><br><br>

    <label>내용:</label><br>
    <textarea id="content" name="content" rows="10" cols="50"></textarea><br><br>

    <label for="file">이미지:</label><br>
    <input type="file" id="file" name="file" accept="image/*"><br>

    <input type="submit" value="작성">
</form>
<a th:href="@{/post/post-list-view}">목록으로</a>
</body>
</html>
