<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="fragments/headerStyle :: headerStyle" />
    <meta charset="UTF-8">
    <title>자유게시판</title>
    <style>
        .tabs { display:flex; gap:8px; margin:12px 0 16px; }
        .tab-btn {
            padding:8px 14px; border:1px solid #ccc; border-radius:6px;
            text-decoration:none; color:#333; background:#fff; font-weight:600;
        }
        .tab-btn.active { background:#2a7ae2; color:#fff; border-color:#2a7ae2; }
        .badge {
            display:inline-block; padding:2px 8px; border-radius:999px;
            border:1px solid #ddd; font-size:12px; color:#444; margin-left:8px; background:#f8f9fa;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: commonHeader}"></div>
<h1>자유게시판</h1>
<a th:href="@{/post/post-create-view}">글 작성</a>

<div class="tabs">
    <a th:href="@{/post/post-list-view(sort='latest')}"
       class="tab-btn"
       th:classappend="${sort}=='latest' ? ' active' : ''">최신순</a>
    <a th:href="@{/post/post-list-view(sort='views')}"
       class="tab-btn"
       th:classappend="${sort}=='views' ? ' active' : ''">조회순</a>
</div>

<table border="1">
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="post : ${postList}">
        <td th:text="${post.postId}">1</td>
        <td>
            <a th:href="@{'/post/post-detail-view/' + ${post.postId}}" th:text="${post.title}">제목</a>
        </td>
        <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
    </tr>
    </tbody>
</table>
</body>
</html>
